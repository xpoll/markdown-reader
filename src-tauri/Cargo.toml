[package]
name = "markdown-reader-lite"
version = "0.1.0"
description = "超轻量 Markdown 阅读器"
authors = ["you"]
edition = "2021"

[lib]
name = "markdown_reader_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
